name: Verify CIVITAS
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm benchmark
      - run: pnpm stability
      - run: pnpm package:win
      - uses: actions/upload-artifact@v4
        with:
          name: CIVITAS-Windows
          path: release/0.1.0/CIVITAS*.exe
